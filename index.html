<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мой Говорящий Юнус</title>
<meta name="theme-color" content="#2a2850">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Юнус">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1d1b3a;color:#fff}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;background:#2a2850;overflow:hidden}

/* верхняя панель */
.top{display:flex;gap:6px;padding:8px 10px;align-items:center;background:rgba(0,0,0,.3);z-index:10}
.stat{flex:1;min-width:0;font-size:15px;text-align:center}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:50%;border-radius:5px;transition:width .4s}
.coins{font-weight:700;font-size:14px;background:#ffd54a;color:#4a3500;padding:5px 10px;border-radius:14px;white-space:nowrap}

/* комната */
.stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(#cfe8ff 0%,#eaf6ff 62%,#b98a5e 62%,#8c6239 100%)}
.stage::before{content:"";position:absolute;left:0;right:0;top:62%;height:6px;background:#fff8;}
.win{position:absolute;left:8%;top:9%;width:74px;height:84px;border:6px solid #fff;border-radius:8px;background:linear-gradient(#7ec8ff,#bfe6ff);box-shadow:0 2px 6px #0003}
.win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#fff;transform:translateX(-50%)}
.frame{position:absolute;right:8%;top:10%;width:62px;height:48px;border:5px solid #b07b45;background:#ffe9a8;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.fs{position:absolute;left:10px;bottom:10px;z-index:9;background:rgba(0,0,0,.35);border:0;color:#fff;border-radius:10px;font-size:20px;width:38px;height:38px}
.mood{position:absolute;right:10px;bottom:10px;font-size:30px;z-index:9}

/* питомец */
#petWrap{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);z-index:3;animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.012,1.02)}}
.pet{position:relative;height:min(50dvh,440px);aspect-ratio:520/700;container-type:inline-size;transform-origin:50% 100%;transition:transform .6s}
.pet.poke{animation:poke .45s}
@keyframes poke{0%{transform:scale(1)}25%{transform:scale(1.07,.9)}55%{transform:scale(.95,1.07) rotate(-2deg)}100%{transform:scale(1)}}
.sleeping .pet{transform:rotate(5deg) translateY(2%)}
.photo{position:absolute;inset:0;border-radius:46% 46% 0 0 / 34% 34% 0 0;overflow:hidden;box-shadow:0 0 0 5px #fff,0 10px 24px rgba(0,0,0,.35);transition:filter .6s}
.photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mouth{position:absolute;left:49%;top:82%;width:25cqw;height:10cqw;transform:translate(-50%,-50%) scaleY(.2);opacity:0;border-radius:50% 50% 56% 56%;
 background:radial-gradient(ellipse at 50% 100%,#e9798a 0 32%,#4a0d1a 34%);box-shadow:0 0 0 2.5px #b95b6a;pointer-events:none;transition:opacity .15s}
.mouth.talk{opacity:1;animation:talk .2s infinite alternate}
.mouth.chew{opacity:1;animation:talk .32s infinite alternate}
.mouth.wow{opacity:1;transform:translate(-50%,-50%) scale(.7,1.2)}
@keyframes talk{from{transform:translate(-50%,-50%) scaleY(.25)}to{transform:translate(-50%,-50%) scaleY(1)}}
.hat{position:absolute;left:50%;top:6%;transform:translate(-50%,-72%);font-size:42cqw;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 3px #0004)}
.glasses{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);font-size:62cqw;line-height:1;pointer-events:none}
#night{position:absolute;inset:0;background:rgba(8,8,40,.62);opacity:0;pointer-events:none;transition:opacity .6s;z-index:5}
.sleeping #night{opacity:1}
.bubble{position:absolute;left:50%;top:8px;transform:translateX(-50%) scale(.8);max-width:88%;background:#fff;color:#222;font-weight:700;font-size:17px;padding:8px 16px;border-radius:18px;opacity:0;transition:.2s;z-index:8;text-align:center;box-shadow:0 3px 10px #0003;pointer-events:none}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.fx{position:absolute;pointer-events:none;z-index:7}
.z{font-weight:900;color:#fff;font-size:24px;animation:zz 2.4s linear forwards}
@keyframes zz{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(30px,-90px) scale(1.4)}}
.soap{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#bfeaff 60%,#7fd0f5);opacity:.85;animation:soap 1.6s ease-out forwards}
@keyframes soap{from{transform:translateY(0) scale(.4);opacity:.9}to{transform:translateY(-70px) scale(1.2);opacity:0}}
.flyer{font-size:44px;z-index:7}

/* мини-игра */
#game{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.item{position:absolute;left:0;top:0;font-size:40px;padding:6px;pointer-events:auto;touch-action:manipulation;line-height:1}
#hud{position:absolute;left:0;right:0;top:8px;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 4px #000a;z-index:9;pointer-events:none}

/* кнопки */
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 6px;background:rgba(0,0,0,.3);z-index:10}
.actions button{background:rgba(255,255,255,.12);border:0;border-radius:12px;color:#fff;font-size:22px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center}
.actions button:active{background:rgba(255,255,255,.3)}
.actions small{font-size:10px;margin-top:2px}
.gaming .actions{visibility:hidden}

/* шторка */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#222;border-radius:20px 20px 0 0;padding:14px 14px 18px;transform:translateY(105%);transition:transform .25s;z-index:30;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.sheet.open{transform:none}
.sheet h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.x{background:#eee;border:0;border-radius:50%;width:32px;height:32px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{background:#f3f0ff;border:2px solid #d9d2ff;border-radius:14px;padding:10px 4px;font-size:34px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#333;font-family:inherit}
.it small{font-size:12px}
.it.on{border-color:#7c4dff;background:#e6dcff}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font-size:16px;padding:12px;border:2px solid #d9d2ff;border-radius:12px;user-select:text;-webkit-user-select:text;font-family:inherit}
.row button{background:#7c4dff;color:#fff;border:0;border-radius:12px;font-size:20px;padding:0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{background:#f3f0ff;border:1px solid #d9d2ff;border-radius:16px;padding:7px 12px;font-size:14px;color:#333;font-family:inherit}

/* старт */
#start{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#5b3df5,#ff6fb5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#start h1{margin:0;font-size:32px;line-height:1.15;text-shadow:0 3px 8px #0004}
#start .pic{width:150px;aspect-ratio:520/700;border-radius:46% 46% 18% 18%/34% 34% 12% 12%;overflow:hidden;box-shadow:0 0 0 5px #fff,0 10px 24px #0005;animation:breathe2 2.4s ease-in-out infinite}
#start .pic img{width:100%;height:100%;object-fit:cover}
@keyframes breathe2{50%{transform:scale(1.05)}}
#start button{font-size:22px;font-weight:800;padding:14px 36px;border:0;border-radius:30px;background:#ffd54a;color:#4a3500;box-shadow:0 5px 0 #c9a21f}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>

  <div class="stage" id="stage">
    <div class="win"></div><div class="frame">🌳</div>
    <div class="bubble" id="bubble"></div>
    <button class="fs" id="fsBtn" aria-label="Полный экран">⛶</button>
    <div class="mood" id="mood">😄</div>
    <div id="hud" hidden></div>

    <div id="petWrap">
      <div class="pet" id="pet">
        <div class="photo" id="photo"><img src="yunus.jpg" alt="Юнус" draggable="false"></div>
        <div class="mouth" id="mouth"></div>
        <div class="glasses" id="glasses"></div>
        <div class="hat" id="hat"></div>
      </div>
    </div>
    <div id="night"></div>
    <div id="game"></div>
  </div>

  <div class="actions">
    <button data-act="food">🍎<small>Еда</small></button>
    <button data-act="wash">🛁<small>Мыть</small></button>
    <button data-act="play">🎮<small>Игра</small></button>
    <button data-act="talk">💬<small>Говорить</small></button>
    <button data-act="shop">🎩<small>Магазин</small></button>
    <button data-act="sleep" id="sleepBtn">😴<small>Спать</small></button>
  </div>

  <div class="sheet" id="sheet">
    <h3><span id="sheetTitle"></span><button class="x" id="sheetX">✕</button></h3>
    <div id="sheetBody"></div>
  </div>

  <div id="start">
    <h1>Мой Говорящий<br>Юнус</h1>
    <div class="pic"><img src="yunus.jpg" alt=""></div>
    <button id="startBtn">▶ Играть</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const cl = v => Math.max(0, Math.min(100, v));

/* ---------- состояние ---------- */
const KEY = 'moy_govoryashchiy_yunus_v1';
const S = {hunger:70, fun:70, clean:70, energy:80, coins:20, owned:{}, hat:'', glasses:'', sleeping:false, best:0, t:Date.now()};
try { const r = JSON.parse(localStorage.getItem(KEY)); if (r) Object.assign(S, r); } catch (e) {}
S.sleeping = false;
(function offline() {
  const dt = Math.min(7200, (Date.now() - S.t) / 1000) * 0.35;
  S.hunger = cl(S.hunger - dt * .13); S.fun = cl(S.fun - dt * .11);
  S.clean = cl(S.clean - dt * .07);  S.energy = cl(S.energy - dt * .03);
})();
function save() { S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const STATS = [['🍖','hunger','#ff8a65'], ['🎈','fun','#ffd54f'], ['🧼','clean','#4dd0e1'], ['⚡','energy','#aed581']];
$('top').innerHTML = STATS.map(s => `<div class="stat">${s[0]}<div class="bar"><i id="b_${s[1]}" style="background:${s[2]}"></i></div></div>`).join('') + '<div class="coins" id="coins"></div>';

const HATS = [
  {id:'cap',   e:'🧢', p:30,  slot:'hat',     n:'Кепка'},
  {id:'hat',   e:'🎩', p:60,  slot:'hat',     n:'Цилиндр'},
  {id:'grad',  e:'🎓', p:80,  slot:'hat',     n:'Выпускник'},
  {id:'crown', e:'👑', p:120, slot:'hat',     n:'Корона'},
  {id:'g1',    e:'👓', p:40,  slot:'glasses', n:'Очки'},
  {id:'g2',    e:'🕶️', p:50,  slot:'glasses', n:'Тёмные очки'}
];
const FOODS = [
  {e:'🍎', n:'Яблоко', h:15, f:0,  c:0},
  {e:'🍌', n:'Банан',  h:16, f:0,  c:0},
  {e:'🍕', n:'Пицца',  h:28, f:3,  c:-4},
  {e:'🍔', n:'Бургер', h:35, f:2,  c:-5},
  {e:'🍰', n:'Тортик', h:18, f:10, c:-4},
  {e:'🥛', n:'Молоко', h:10, f:0,  c:0}
];

/* ---------- отрисовка ---------- */
function render() {
  STATS.forEach(s => $('b_' + s[1]).style.width = Math.round(S[s[1]]) + '%');
  $('coins').textContent = '🪙 ' + S.coins;
  const m = Math.min(S.hunger, S.fun, S.clean, S.energy);
  $('mood').textContent = S.sleeping ? '😴' : m > 60 ? '😄' : m > 30 ? '😐' : '😢';
  $('photo').style.filter = (!S.sleeping && m < 30) ? 'saturate(.55) brightness(.92)' : 'none';
  $('hat').textContent = S.hat ? (HATS.find(h => h.id === S.hat) || {}).e || '' : '';
  $('glasses').textContent = S.glasses ? (HATS.find(h => h.id === S.glasses) || {}).e || '' : '';
  $('app').classList.toggle('sleeping', S.sleeping);
  $('sleepBtn').innerHTML = S.sleeping ? '☀️<small>Будить</small>' : '😴<small>Спать</small>';
}

/* ---------- речь ---------- */
let bt, mt, busy = false;
function say(text, opt = {}) {
  const b = $('bubble');
  b.textContent = text; b.classList.add('show');
  clearTimeout(bt); bt = setTimeout(() => b.classList.remove('show'), 2200 + text.length * 60);
  const dur = Math.min(4500, Math.max(700, text.length * 85));
  $('mouth').className = 'mouth talk';
  clearTimeout(mt); mt = setTimeout(() => $('mouth').className = 'mouth', dur);
  if (opt.voice) {
    try {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ru-RU'; u.pitch = 1.9; u.rate = 1.15;
        speechSynthesis.speak(u);
      }
    } catch (e) {}
  }
}

/* ---------- эффекты ---------- */
function stageRect() { return $('stage').getBoundingClientRect(); }
function addFx(el, ms) { $('stage').appendChild(el); setTimeout(() => el.remove(), ms); }
let zTimer = null;
function updateZ() {
  if (S.sleeping && !zTimer) {
    zTimer = setInterval(() => {
      const r = $('pet').getBoundingClientRect(), st = stageRect();
      const z = document.createElement('div');
      z.className = 'fx z'; z.textContent = rnd(['Z', 'z', 'Zz']);
      z.style.left = (r.left - st.left + r.width * .7) + 'px';
      z.style.top = (r.top - st.top + r.height * .12) + 'px';
      z.style.zIndex = 9;
      addFx(z, 2400);
    }, 900);
  } else if (!S.sleeping && zTimer) { clearInterval(zTimer); zTimer = null; }
}

/* ---------- действия ---------- */
function poke() {
  if (game) return;
  if (S.sleeping) { toggleSleep(); say('Ой! Я же спал...', {voice: true}); return; }
  const p = $('pet'); p.classList.remove('poke'); void p.offsetWidth; p.classList.add('poke');
  S.fun = cl(S.fun + 2);
  S.pokes = (S.pokes || 0) + 1;
  if (S.pokes % 8 === 0) { S.coins++; }
  let t = rnd(['Ой!', 'Хи-хи!', 'Щекотно!', 'Ха-ха-ха!', 'Ещё!', 'Привет!']);
  if (S.hunger < 30) t = 'Я голодный! Покорми меня!';
  say(t, {voice: true}); render();
}
$('pet').addEventListener('pointerdown', poke);

function feed(i) {
  if (S.sleeping) return say('Тсс... я сплю', {});
  if (busy) return;
  const f = FOODS[i];
  if (S.hunger > 96) { closeSheet(); return say('Я уже наелся!', {voice: true}); }
  busy = true; closeSheet();
  const st = stageRect(), mr = $('mouth').getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'fx flyer'; el.textContent = f.e;
  el.style.left = (st.width / 2 - 22) + 'px'; el.style.top = (st.height - 60) + 'px';
  $('stage').appendChild(el);
  const dx = (mr.left + mr.width / 2 - st.left) - (st.width / 2), dy = (mr.top + mr.height / 2 - st.top) - (st.height - 38);
  $('mouth').className = 'mouth wow';
  el.animate([{transform: 'translate(0,0) scale(1)'}, {transform: `translate(${dx}px,${dy}px) scale(.45)`}], {duration: 650, easing: 'ease-in', fill: 'forwards'})
    .onfinish = () => {
      el.remove();
      $('mouth').className = 'mouth chew';
      setTimeout(() => {
        $('mouth').className = 'mouth';
        S.hunger = cl(S.hunger + f.h); S.fun = cl(S.fun + f.f); S.clean = cl(S.clean + f.c);
        busy = false; say(rnd(['Ням-ням!', 'Вкуснятина!', 'Спасибо!']), {voice: true}); render();
      }, 1200);
    };
}

function wash() {
  if (S.sleeping) return say('Тсс... я сплю');
  if (busy) return; busy = true;
  const r = $('pet').getBoundingClientRect(), st = stageRect();
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('div');
    const s = 16 + Math.random() * 26;
    d.className = 'fx soap';
    d.style.width = d.style.height = s + 'px';
    d.style.left = (r.left - st.left + Math.random() * (r.width - s)) + 'px';
    d.style.top = (r.top - st.top + r.height * (.15 + Math.random() * .75)) + 'px';
    d.style.animationDelay = (Math.random() * .6) + 's';
    addFx(d, 2400);
  }
  say('Бульк-бульк!', {});
  setTimeout(() => { S.clean = cl(S.clean + 45); busy = false; say('Чистенький! Спасибо!', {voice: true}); render(); }, 1700);
}

function toggleSleep() {
  S.sleeping = !S.sleeping;
  if (S.sleeping) { closeSheet(); say('Спокойной ночи... Zzz', {}); }
  else say('Доброе утро!', {voice: true});
  updateZ(); render();
}

/* ---------- шторки ---------- */
function openSheet(title, html) { $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html; $('sheet').classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }
$('sheetX').onclick = closeSheet;

function openFood() {
  openSheet('Чем покормим?', '<div class="grid">' + FOODS.map((f, i) => `<button class="it" data-food="${i}"><span>${f.e}</span><small>${f.n}</small></button>`).join('') + '</div>');
}
function openTalk() {
  const chips = ['Привет!', 'Как дела?', 'Ты классный!', 'Давай дружить', 'Я люблю математику'];
  openSheet('Скажи что-нибудь — Юнус повторит', '<div class="row"><input id="tin" maxlength="80" placeholder="Напиши фразу..." autocomplete="off"><button id="tgo">▶</button></div><div class="chips">' + chips.map(c => `<button data-chip="${c}">${c}</button>`).join('') + '</div>');
  $('tin').addEventListener('keydown', e => { if (e.key === 'Enter') sendTalk($('tin').value); });
  $('tgo').onclick = () => sendTalk($('tin').value);
}
function sendTalk(t) {
  t = (t || '').trim(); if (!t) return;
  closeSheet();
  if (S.sleeping) toggleSleep();
  S.fun = cl(S.fun + 4);
  setTimeout(() => say(t, {voice: true}), 250); render();
}
function openShop() {
  const g = HATS.map(h => {
    const owned = S.owned[h.id], on = S.hat === h.id || S.glasses === h.id;
    const lab = on ? 'Надето ✓' : owned ? 'Надеть' : '🪙 ' + h.p;
    return `<button class="it ${on ? 'on' : ''}" data-shop="${h.id}"><span>${h.e}</span><small>${h.n}</small><small><b>${lab}</b></small></button>`;
  }).join('');
  openSheet('Магазин (у тебя 🪙 ' + S.coins + ')', '<div class="grid">' + g + '</div>');
}
function shop(id) {
  const h = HATS.find(x => x.id === id);
  if (!S.owned[id]) {
    if (S.coins < h.p) { say('Не хватает монет!', {}); return; }
    S.coins -= h.p; S.owned[id] = true;
  }
  S[h.slot] = (S[h.slot] === id) ? '' : id;
  if (S[h.slot] === id) say('Как я выгляжу?', {voice: true});
  render(); openShop(); save();
}

$('sheetBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.food !== undefined) feed(+t.dataset.food);
  else if (t.dataset.chip) sendTalk(t.dataset.chip);
  else if (t.dataset.shop) shop(t.dataset.shop);
});
document.querySelector('.actions').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'sleep') return toggleSleep();
  if (S.sleeping && a !== 'talk') { closeSheet(); return say('Тсс... он спит. Разбуди его кнопкой ☀️'); }
  if (a === 'food') openFood();
  else if (a === 'wash') { closeSheet(); wash(); }
  else if (a === 'play') startGame();
  else if (a === 'talk') openTalk();
  else if (a === 'shop') openShop();
});

/* ---------- мини-игра «Лови еду» ---------- */
let game = null;
function startGame() {
  if (game || busy) return;
  if (S.energy < 10) return say('Я устал... Дай поспать', {voice: true});
  closeSheet();
  $('app').classList.add('gaming');
  const layer = $('game'), hud = $('hud'); hud.hidden = false;
  game = {score: 0, time: 20, items: [], spawn: 0, last: performance.now()};
  say('Лови еду! Острого не трогай 🌶️', {voice: true});
  function spawn() {
    const bad = Math.random() < .2;
    const el = document.createElement('div');
    el.className = 'item'; el.textContent = bad ? '🌶️' : rnd(['🍎', '🍕', '🍩', '🍔', '⭐', '🍪']);
    const W = layer.clientWidth, x = Math.random() * (W - 56);
    const it = {el, x, y: -60, v: 130 + Math.random() * 110 + (20 - game.time) * 7, bad, dead: false};
    el.style.transform = `translate(${x}px,${it.y}px)`;
    el.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      if (it.dead) return; it.dead = true; el.remove();
      if (bad) { game.score = Math.max(0, game.score - 2); say('Остро! Фу!', {}); }
      else { game.score++; $('mouth').className = 'mouth wow'; setTimeout(() => { if (!S.sleeping) $('mouth').className = 'mouth'; }, 250); }
    });
    layer.appendChild(el); game.items.push(it);
  }
  function loop(now) {
    if (!game) return;
    const dt = Math.min(.05, (now - game.last) / 1000); game.last = now;
    game.time -= dt; game.spawn -= dt;
    if (game.spawn <= 0) { spawn(); game.spawn = Math.max(.28, .6 - (20 - game.time) * .015); }
    const H = layer.clientHeight;
    for (const it of game.items) {
      if (it.dead) continue;
      it.y += it.v * dt; it.el.style.transform = `translate(${it.x}px,${it.y}px)`;
      if (it.y > H) { it.dead = true; it.el.remove(); }
    }
    game.items = game.items.filter(i => !i.dead);
    hud.textContent = `⭐ ${game.score}   ⏱ ${Math.ceil(game.time)}`;
    if (game.time <= 0) return endGame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
function endGame() {
  const sc = game.score; game = null;
  $('game').innerHTML = ''; $('hud').hidden = true; $('app').classList.remove('gaming');
  S.coins += sc; S.fun = cl(S.fun + Math.min(45, sc * 2.5)); S.hunger = cl(S.hunger - 5); S.energy = cl(S.energy - 8);
  const rec = sc > (S.best || 0); if (rec) S.best = sc;
  say(rec && sc > 0 ? `Новый рекорд: ${sc}! +${sc} 🪙` : `Ура! Поймали ${sc}. +${sc} 🪙`, {voice: true});
  render(); save();
}

/* ---------- жизнь ---------- */
let ticks = 0;
function tick(dt) {
  if (S.sleeping) {
    S.energy = cl(S.energy + dt * 1.5); S.hunger = cl(S.hunger - dt * .04);
    S.fun = cl(S.fun - dt * .03); S.clean = cl(S.clean - dt * .03);
    if (S.energy >= 100) toggleSleep();
  } else {
    S.hunger = cl(S.hunger - dt * .13); S.fun = cl(S.fun - dt * .11);
    S.clean = cl(S.clean - dt * .07); S.energy = cl(S.energy - dt * .07);
  }
}
setInterval(() => { tick(1); render(); if (++ticks % 5 === 0) save(); }, 1000);

setInterval(() => {
  if (S.sleeping || busy || game || $('start').style.display === 'none' === false) return;
  const needs = [[S.hunger, 'Я голодный!'], [S.fun, 'Мне скучно...'], [S.clean, 'Хочу помыться!'], [S.energy, 'Хочу спать...']].sort((a, b) => a[0] - b[0])[0];
  if (needs[0] < 35) say(needs[1], {});
  else if (Math.random() < .5) say(rnd(['Как дела?', 'Поиграем?', 'Я Юнус!', 'Здорово тут!', 'Потыкай меня!']), {});
}, 9000);

function toggleFS() {
  try {
    const d = document, e = d.documentElement;
    const on = d.fullscreenElement || d.webkitFullscreenElement;
    const p = on ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (e.requestFullscreen || e.webkitRequestFullscreen).call(e);
    if (p && p.catch) p.catch(() => {});
  } catch (err) {}
}
(function () {
  const e = document.documentElement;
  const can = e.requestFullscreen || e.webkitRequestFullscreen;
  const installed = window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone);
  if (!can || installed) $('fsBtn').style.display = 'none';
  $('fsBtn').addEventListener('click', toggleFS);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (err) {} });
  }
})();

$('startBtn').onclick = () => {
  try { if (!document.fullscreenElement && !navigator.standalone) toggleFS(); } catch (err) {}
  $('start').style.display = 'none';
  render(); updateZ();
  say('Привет! Я Юнус!', {voice: true});
};
window.addEventListener('pagehide', save);
render();
</script>
</body>
