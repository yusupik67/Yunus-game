<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мой Говорящий Юнус</title>
<meta name="theme-color" content="#2a2850">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Юнус">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1d1b3a;color:#fff}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;background:#2a2850;overflow:hidden}

/* верхняя панель */
.top{display:flex;gap:6px;padding:8px 10px;align-items:center;background:rgba(0,0,0,.3);z-index:10}
.stat{flex:1;min-width:0;font-size:15px;text-align:center}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:50%;border-radius:5px;transition:width .4s}
.coins{font-weight:700;font-size:14px;background:#ffd54a;color:#4a3500;padding:5px 10px;border-radius:14px;white-space:nowrap}

/* комната */
.stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(#cfe8ff 0%,#eaf6ff 62%,#b98a5e 62%,#8c6239 100%)}
.stage::before{content:"";position:absolute;left:0;right:0;top:62%;height:6px;background:#fff8;}
.win{position:absolute;left:8%;top:9%;width:74px;height:84px;border:6px solid #fff;border-radius:8px;background:linear-gradient(#7ec8ff,#bfe6ff);box-shadow:0 2px 6px #0003}
.win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#fff;transform:translateX(-50%)}
.frame{position:absolute;right:8%;top:10%;width:62px;height:48px;border:5px solid #b07b45;background:#ffe9a8;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.fs{position:absolute;left:10px;bottom:10px;z-index:9;background:rgba(0,0,0,.35);border:0;color:#fff;border-radius:10px;font-size:20px;width:38px;height:38px}
.mood{position:absolute;right:10px;bottom:10px;font-size:30px;z-index:9}

/* питомец */
#petWrap{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);z-index:3;animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.012,1.02)}}
.pet{position:relative;height:min(50dvh,440px);aspect-ratio:520/700;container-type:inline-size;transform-origin:50% 100%;transition:transform .6s}
.pet.poke{animation:poke .45s}
@keyframes poke{0%{transform:scale(1)}25%{transform:scale(1.07,.9)}55%{transform:scale(.95,1.07) rotate(-2deg)}100%{transform:scale(1)}}
.sleeping .pet{transform:rotate(5deg) translateY(2%)}
.photo{position:absolute;inset:0;border-radius:46% 46% 0 0 / 34% 34% 0 0;overflow:hidden;box-shadow:0 0 0 5px #fff,0 10px 24px rgba(0,0,0,.35);transition:filter .6s}
.photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mouth{position:absolute;left:49%;top:82%;width:25cqw;height:10cqw;transform:translate(-50%,-50%) scaleY(.2);opacity:0;border-radius:50% 50% 56% 56%;
 background:radial-gradient(ellipse at 50% 100%,#e9798a 0 32%,#4a0d1a 34%);box-shadow:0 0 0 2.5px #b95b6a;pointer-events:none;transition:opacity .15s}
.mouth.talk{opacity:1;animation:talk .2s infinite alternate}
.mouth.chew{opacity:1;animation:talk .32s infinite alternate}
.mouth.wow{opacity:1;transform:translate(-50%,-50%) scale(.7,1.2)}
@keyframes talk{from{transform:translate(-50%,-50%) scaleY(.25)}to{transform:translate(-50%,-50%) scaleY(1)}}
.hat{position:absolute;left:50%;top:6%;transform:translate(-50%,-72%);font-size:42cqw;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 3px #0004)}
.glasses{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);font-size:62cqw;line-height:1;pointer-events:none}
#night{position:absolute;inset:0;background:rgba(8,8,40,.62);opacity:0;pointer-events:none;transition:opacity .6s;z-index:5}
.sleeping #night{opacity:1}
.bubble{position:absolute;left:50%;top:50px;transform:translateX(-50%) scale(.8);max-width:88%;background:#fff;color:#222;font-weight:700;font-size:17px;padding:8px 16px;border-radius:18px;opacity:0;transition:.2s;z-index:8;text-align:center;box-shadow:0 3px 10px #0003;pointer-events:none}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.fx{position:absolute;pointer-events:none;z-index:7}
.z{font-weight:900;color:#fff;font-size:24px;animation:zz 2.4s linear forwards}
@keyframes zz{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(30px,-90px) scale(1.4)}}
.soap{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#bfeaff 60%,#7fd0f5);opacity:.85;animation:soap 1.6s ease-out forwards}
@keyframes soap{from{transform:translateY(0) scale(.4);opacity:.9}to{transform:translateY(-70px) scale(1.2);opacity:0}}
.flyer{font-size:44px;z-index:7}

/* счётчик и ауры */
html,body,#pet{touch-action:manipulation}
.clicks{position:absolute;right:10px;top:8px;z-index:9;background:rgba(0,0,0,.4);color:#fff;font-weight:800;font-size:18px;padding:6px 14px;border-radius:16px;box-shadow:0 2px 6px #0004;pointer-events:none}
.tap{font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 5px #000b;z-index:9;animation:tapup .7s ease-out forwards}
@keyframes tapup{to{transform:translateY(-55px) scale(1.2);opacity:0}}
.aura{position:absolute;left:0;width:100%;bottom:-3%;display:none;transform-origin:50% 100%;pointer-events:none;--hue:0deg;animation:glow 1.8s ease-in-out infinite alternate}
.aura.k-violet{--hue:28deg}
@keyframes glow{from{filter:hue-rotate(var(--hue)) brightness(1)}to{filter:hue-rotate(var(--hue)) brightness(1.3)}}
.aura img{position:absolute;left:50%;bottom:0;height:100%;width:auto;max-width:none;transform:translateX(-50%);transform-origin:50% 100%}
.aura .a1{animation:auraA 1.1s ease-in-out infinite alternate}
.aura .a2{mix-blend-mode:screen;opacity:.6;animation:auraB 1.7s ease-in-out infinite alternate}
@keyframes auraA{0%{transform:translateX(-50%) scale(1,1) skewX(0deg)}50%{transform:translateX(-50%) scale(1.04,1.09) skewX(1.5deg)}100%{transform:translateX(-50%) scale(.98,1.14) skewX(-1.5deg)}}
@keyframes auraB{0%{transform:translateX(-50%) scaleX(-1) scale(1.06,1.02);opacity:.45}50%{transform:translateX(-50%) scaleX(-1) scale(1,1.12);opacity:.8}100%{transform:translateX(-50%) scaleX(-1) scale(1.1,1.06);opacity:.55}}
#sheetBody{max-height:62dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sec{margin:12px 0 8px;font-weight:700;font-size:14px;color:#555}
.sec:first-child{margin-top:0}
.thumb{width:64px;height:64px;background:#2a2850;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:58px;max-height:58px}
.thumb.k-violet img{filter:hue-rotate(28deg)}
.it.lock{opacity:.55}
.it small b{font-size:12px}
#start .ver{font-size:13px;opacity:.8}

/* причёски, имя, меню */
.hair{position:absolute;left:50%;display:none;pointer-events:none;transform:translateX(-50%);transform-origin:50% 0;animation:hairSway 3.2s ease-in-out infinite alternate;filter:drop-shadow(0 2px 3px #0003)}
@keyframes hairSway{from{transform:translateX(-50%) rotate(-.8deg)}to{transform:translateX(-50%) rotate(.8deg)}}
.nameplate{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:17px;padding:6px 16px;border-radius:16px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px #0005}
.gear{position:absolute;left:10px;top:8px;z-index:9;background:rgba(0,0,0,.4);border:0;color:#fff;border-radius:12px;font-size:20px;width:40px;height:36px}
.thumb.ht{background:#a9a6d6}
.thumb.ht img{max-width:60px;max-height:56px}
.msg{min-height:20px;font-size:14px;margin-top:6px;color:#444}
.msg.ok{color:#1b8a3a}.msg.err{color:#c62828}

/* шаринган */
.eyes{position:absolute;left:51.7%;top:50.8%;width:67%;transform:translate(-50%,-50%);display:none;pointer-events:none;animation:eyeGlow 2.2s ease-in-out infinite alternate}
.eyes img{display:block;width:100%}
.eyes .ec{position:absolute;left:0;top:0;opacity:0}
.eyes .eo{animation:blinkO 6s infinite}
.eyes .ec{animation:blinkC 6s infinite}
@keyframes blinkO{0%,88%{opacity:1}89%,90%{opacity:0}91%,93%{opacity:1}94%,96%{opacity:0}97%,100%{opacity:1}}
@keyframes blinkC{0%,88%{opacity:0}89%,90%{opacity:1}91%,93%{opacity:0}94%,96%{opacity:1}97%,100%{opacity:0}}
@keyframes eyeGlow{from{filter:drop-shadow(0 0 1px rgba(255,30,30,.25))}to{filter:drop-shadow(0 0 5px rgba(255,40,40,.6))}}
.thumb.et{width:96px;height:48px;background:#d9a79d}
.thumb.et img{max-width:90px;max-height:44px}
.thumb.k-black{background:#9a98c8}
/* новые ауры */
.aura.k-black .a1{animation:smokeA 3.6s ease-in-out infinite alternate}
.aura.k-black .a2{mix-blend-mode:normal;animation:smokeB 5.2s ease-in-out infinite alternate}
@keyframes smokeA{0%{transform:translateX(-50%) scale(1,1) rotate(-1.5deg)}50%{transform:translateX(-50%) scale(1.05,1.1) rotate(1deg)}100%{transform:translateX(-50%) scale(.98,1.06) translateY(-1.5%) rotate(2deg)}}
@keyframes smokeB{0%{transform:translateX(-50%) scaleX(-1) scale(1.1,1) rotate(2deg);opacity:.35}50%{transform:translateX(-50%) scaleX(-1) scale(1,1.14) translateY(-3%) rotate(-1deg);opacity:.6}100%{transform:translateX(-50%) scaleX(-1) scale(1.12,1.08) rotate(-2deg);opacity:.4}}
.aura.k-plasma{animation:plasmaGlow 2.4s ease-in-out infinite alternate}
@keyframes plasmaGlow{from{filter:hue-rotate(-20deg) brightness(1)}to{filter:hue-rotate(20deg) brightness(1.3)}}
.aura.k-plasma .a1{animation:plasmaA .9s ease-in-out infinite alternate}
@keyframes plasmaA{0%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.03,1.05) skewX(1deg)}100%{transform:translateX(-50%) scale(.98,1.08) skewX(-1deg)}}
/* золотые глаза */
.eyesG{position:absolute;left:11.54%;top:47.14%;width:78.85%;display:none;pointer-events:none;animation:goldGlow 2.4s ease-in-out infinite alternate}
.eyesG img{display:block;width:100%}
.eyesG .ec{position:absolute;left:0;top:0;opacity:0}
.eyesG .eo{animation:blinkO 5s infinite}
.eyesG .ec{animation:blinkC 5s infinite}
@keyframes goldGlow{from{filter:drop-shadow(0 0 1px rgba(255,200,0,.3))}to{filter:drop-shadow(0 0 6px rgba(255,210,40,.9))}}
.thumb.k-blood{background:#6b6a9a}
.aura.k-blood{animation:bloodGlow 1.4s ease-in-out infinite alternate}
@keyframes bloodGlow{from{filter:brightness(.95) saturate(1)}to{filter:brightness(1.35) saturate(1.3)}}
.aura.k-sun{transform-origin:50% 50%;animation:sunPulse 2.6s ease-in-out infinite alternate}
@keyframes sunPulse{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.3);transform:scale(1.07)}}
.aura.k-sun img{transform-origin:50% 50%}
.aura.k-sun .a1{animation:sunSpin 28s linear infinite}
.aura.k-sun .a2{animation:sunSpinR 18s linear infinite}
@keyframes sunSpin{from{transform:translateX(-50%) rotate(0deg)}to{transform:translateX(-50%) rotate(360deg)}}
@keyframes sunSpinR{from{transform:translateX(-50%) rotate(0deg)}to{transform:translateX(-50%) rotate(-360deg)}}
.ring{position:absolute;left:50%;top:-2%;width:145cqw;aspect-ratio:720/697;transform:translate(-50%,-50%);display:none;pointer-events:none}
.rw{position:absolute;inset:0;animation:rspin 18s linear infinite}
.rw img{position:absolute;display:block}
.rw .rr{left:0;top:0;width:100%;height:100%}
.rw .rh{transform-origin:50% 50%;animation:rspinr 18s linear infinite}
@keyframes rspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes rspinr{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
/* 1.1.6 */
.stage.hasbg::before{display:none}
.hat img{display:block;width:96cqw;filter:none}
.hat.big{transform:translate(-50%,-58%)}
.thumb.bt{background-size:cover;background-position:center}
.thumb.bt.none{background:linear-gradient(#cfe8ff 0%,#eaf6ff 62%,#b98a5e 62%,#8c6239 100%)}
.it .fi{height:34px;display:block}
.flyer img{height:44px;display:block}
.lvl{position:absolute;left:10px;top:50px;z-index:9;background:rgba(0,0,0,.4);color:#fff;font-weight:800;font-size:14px;padding:4px 10px 6px;border-radius:12px;min-width:64px;pointer-events:none}
.lvl i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:3px;overflow:hidden}
.lvl u{display:block;height:100%;width:0;background:#ffd54a;text-decoration:none}
.fxbar{position:absolute;right:10px;top:46px;z-index:9;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.fxbar span{background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:13px;padding:3px 10px;border-radius:12px}
/* журнал */
.log ul{margin:2px 0 10px 18px;padding:0;font-size:14px;line-height:1.45;color:#333}
.log .ver{font-weight:800;font-size:15px;color:#4b2fd0;margin-top:8px}

/* мини-игра */
#game{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.item{position:absolute;left:0;top:0;font-size:40px;padding:6px;pointer-events:auto;touch-action:manipulation;line-height:1}
#hud{position:absolute;left:0;right:0;top:8px;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 4px #000a;z-index:9;pointer-events:none}

/* кнопки */
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 6px;background:rgba(0,0,0,.3);z-index:10}
.actions button{background:rgba(255,255,255,.12);border:0;border-radius:12px;color:#fff;font-size:22px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center}
.actions button:active{background:rgba(255,255,255,.3)}
.actions small{font-size:10px;margin-top:2px}
.gaming .actions{visibility:hidden}

/* шторка */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#222;border-radius:20px 20px 0 0;padding:14px 14px 18px;transform:translateY(105%);transition:transform .25s;z-index:30;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.sheet.open{transform:none}
.sheet h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.x{background:#eee;border:0;border-radius:50%;width:32px;height:32px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{background:#f3f0ff;border:2px solid #d9d2ff;border-radius:14px;padding:10px 4px;font-size:34px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#333;font-family:inherit}
.it small{font-size:12px}
.it.on{border-color:#7c4dff;background:#e6dcff}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font-size:16px;padding:12px;border:2px solid #d9d2ff;border-radius:12px;user-select:text;-webkit-user-select:text;font-family:inherit}
.row button{background:#7c4dff;color:#fff;border:0;border-radius:12px;font-size:20px;padding:0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{background:#f3f0ff;border:1px solid #d9d2ff;border-radius:16px;padding:7px 12px;font-size:14px;color:#333;font-family:inherit}

/* старт */
#start{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#5b3df5,#ff6fb5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#start h1{margin:0;font-size:32px;line-height:1.15;text-shadow:0 3px 8px #0004}
#start .pic{width:150px;aspect-ratio:520/700;border-radius:46% 46% 18% 18%/34% 34% 12% 12%;overflow:hidden;box-shadow:0 0 0 5px #fff,0 10px 24px #0005;animation:breathe2 2.4s ease-in-out infinite}
#start .pic img{width:100%;height:100%;object-fit:cover}
@keyframes breathe2{50%{transform:scale(1.05)}}
#start button{font-size:22px;font-weight:800;padding:14px 36px;border:0;border-radius:30px;background:#ffd54a;color:#4a3500;box-shadow:0 5px 0 #c9a21f}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>

  <div class="stage" id="stage">
    <div class="win"></div><div class="clicks" id="clicks">👆 0</div><div class="fxbar" id="fxbar"></div>
    <div class="lvl" id="lvl"><b id="lvlN">Ур. 0</b><i><u id="lvlBar"></u></i></div>
    <div class="bubble" id="bubble"></div>
    <button class="gear" id="gearBtn" aria-label="Меню">⚙️</button>
    <div class="nameplate" id="nameplate">Юнус</div>
    <button class="fs" id="fsBtn" aria-label="Полный экран">⛶</button>
    <div class="mood" id="mood">😄</div>
    <div id="hud" hidden></div>

    <div id="petWrap">
      <div class="aura" id="aura"><img class="a1" alt=""><img class="a2" alt=""></div>
      <div class="pet" id="pet">
        <div class="ring" id="ring"><div class="rw"><img class="rr" data-src="aura-d9r.png" alt=""><img class="rh" data-src="aura-d9h1.png" style="left:11.67%;top:4.88%;width:26.53%" alt=""><img class="rh" data-src="aura-d9h2.png" style="left:63.47%;top:5.31%;width:26.81%" alt=""><img class="rh" data-src="aura-d9h3.png" style="left:11.53%;top:58.97%;width:26.81%" alt=""><img class="rh" data-src="aura-d9h4.png" style="left:63.19%;top:57.10%;width:27.08%" alt=""></div></div>
        <div class="photo" id="photo"><img src="yunus.jpg" alt="Юнус" draggable="false"></div>
        <div class="eyes" id="eyes"><img class="eo" src="sharingan-open.png" alt=""><img class="ec" src="sharingan-closed.png" alt=""></div>
        <div class="eyesG" id="eyesG"><img class="eo" src="gold-open.png" alt=""><img class="ec" src="gold-closed.png" alt=""></div>
        <div class="mouth" id="mouth"></div>
        <img class="hair" id="hair" alt="">
        <div class="glasses" id="glasses"></div>
        <div class="hat" id="hat"></div>
      </div>
    </div>
    <div id="night"></div>
    <div id="game"></div>
  </div>

  <div class="actions">
    <button data-act="food">🍎<small>Еда</small></button>
    <button data-act="wash">🛁<small>Мыть</small></button>
    <button data-act="play">🎮<small>Игра</small></button>
    <button data-act="talk">💬<small>Говорить</small></button>
    <button data-act="shop">🎩<small>Магазин</small></button>
    <button data-act="sleep" id="sleepBtn">😴<small>Спать</small></button>
  </div>

  <div class="sheet" id="sheet">
    <h3><span id="sheetTitle"></span><button class="x" id="sheetX">✕</button></h3>
    <div id="sheetBody"></div>
  </div>

  <div id="start">
    <h1>Мой Говорящий<br>Юнус</h1>
    <div class="pic"><img src="yunus.jpg" alt=""></div>
    <button id="startBtn">▶ Играть</button>
    <div class="ver">версия 1.2.0</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const cl = v => Math.max(0, Math.min(100, v));

/* ---------- состояние ---------- */
const KEY = 'moy_govoryashchiy_yunus_v1';
const S = {hunger:70, fun:70, clean:70, energy:80, coins:20, owned:{}, hat:'', glasses:'', sleeping:false, best:0, clicks:0, aura:'', ownedAuras:{}, hair:'', ownedHair:{}, name:'Юнус', codes:[], eyes:'', ownedEyes:{}, bg:'', ownedBg:{}, fx:{}, lvl:0, xp:0, seenVer:'', t:Date.now()};
try { const r = JSON.parse(localStorage.getItem(KEY)); if (r) Object.assign(S, r); } catch (e) {}
S.sleeping = false;
(function offline() {
  const dt = Math.min(7200, (Date.now() - S.t) / 1000) * 0.35;
  S.hunger = cl(S.hunger - dt * .13); S.fun = cl(S.fun - dt * .11);
  S.clean = cl(S.clean - dt * .07);  S.energy = cl(S.energy - dt * .03);
})();

/* ---------- уровни ---------- */
const XPT = [0, 15, 19, 22];
(function () {
  const r1 = Math.pow(180 / 22, 1 / 8), r2 = Math.pow(107001 / 252, 1 / 18);
  for (let L = 4; L <= 11; L++) XPT[L] = L === 11 ? 180 : Math.round(22 * Math.pow(r1, L - 3));
  for (let L = 12; L <= 30; L++) XPT[L] = L === 30 ? 107001 : Math.round(252 * Math.pow(r2, L - 12));
})();
const MAXLVL = 30, XPR = {hunger: 5, fun: 1, clean: 5, energy: 10};
let prevSt = null, inXp = false;
function xpMult() { return fxLeft('xp4') > 0 ? 4 : fxLeft('xp2') > 0 ? 2 : 1; }
function gainXp(a) {
  if (S.lvl >= MAXLVL) { S.xp = 0; return; }
  S.xp += a * xpMult();
  let up = 0, coins = 0;
  while (S.lvl < MAXLVL && S.xp >= XPT[S.lvl + 1]) {
    const need = XPT[S.lvl + 1]; S.xp -= need; S.lvl++;
    const m = Math.round(need / S.lvl / 4); S.coins += m; coins += m; up = S.lvl;
  }
  if (S.lvl >= MAXLVL) S.xp = 0;
  if (up) say('Уровень ' + up + '! +' + coins + ' 🪙', {voice: true});
}
function xpWatch() {
  if (inXp) return; inXp = true;
  const cur = {hunger: S.hunger, fun: S.fun, clean: S.clean, energy: S.energy};
  if (prevSt) {
    let t = 0;
    for (const k in XPR) { const d = cur[k] - prevSt[k]; if (d > 0) t += d * XPR[k] / 10; }
    prevSt = cur;
    if (t > 0) gainXp(t);
  } else prevSt = cur;
  inXp = false;
}
function renderLvl() {
  const need = XPT[S.lvl + 1];
  $('lvlN').textContent = S.lvl >= MAXLVL ? 'Ур. ' + S.lvl + ' MAX' : 'Ур. ' + S.lvl;
  $('lvlBar').style.width = (S.lvl >= MAXLVL ? 100 : Math.min(100, S.xp / need * 100)) + '%';
}

function h53(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0, ch; i < s.length; i++) { ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

function poke(ev) {

  const prev = S.clicks || 0, add = fxLeft('dbl') > 0 ? 2 : 1;
  S.clicks = prev + add;
  const crossed = n => Math.floor(S.clicks / n) > Math.floor(prev / n);
  updateClicks(); tapFx(ev);
  if (S.aura) $('aura').animate([{transform: 'scale(1)'}, {transform: 'scale(1.07)'}, {transform: 'scale(1)'}], {duration: 220});
  const unlocked = AURAS.find(x => x.req > prev && x.req <= S.clicks);
  if (S.sleeping) { toggleSleep(); say('Ой! Я же спал...', {voice: true}); return; }
  const p = $('pet'); p.classList.remove('poke'); void p.offsetWidth; p.classList.add('poke');
  S.fun = cl(S.fun + 2);
  if (crossed(fxLeft('cheap') > 0 ? 4 : 8)) S.coins++;
  let t = rnd(['Ой!', 'Хи-хи!', 'Щекотно!', 'Ха-ха-ха!', 'Ещё!', 'Привет!']), voice = crossed(6);
  if (S.hunger < 30) t = 'Я голодный! Покорми меня!';

}

  if (S.coins < f.p) { say('Не хватает монет! 🪙 ' + f.p, {}); return; }
  S.coins -= f.p; render();
  busy = true; closeSheet();
  const st = stageRect(), mr = $('mouth').getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'fx flyer'; if (f.img) el.innerHTML = '<img src="' + f.img + '" alt="">'; else el.textContent = f.e;
  el.style.left = (st.width / 2 - 22) + 'px'; el.style.top = (st.height - 60) + 'px';
  $('stage').appendChild(el);
  const dx = (mr.left + mr.width / 2 - st.left) - (st.width / 2), dy = (mr.top + mr.height / 2 - st.top) - (st.height - 38);
  $('mouth').className = 'mouth wow';
  el.animate([{transform: 'translate(0,0) scale(1)'}, {transform: `translate(${dx}px,${dy}px) scale(.45)`}], {duration: 650, easing: 'ease-in', fill: 'forwards'})
    .onfinish = () => {
      el.remove();
      $('mouth').className = 'mouth chew';
      setTimeout(() => {
        $('mouth').className = 'mouth';
        S.hunger = cl(S.hunger + f.h); S.fun = cl(S.fun + f.f); S.clean = cl(S.clean + f.c); if (f.en) S.energy = cl(S.energy + f.en);
        if (f.fx) { S.fx = S.fx || {}; S.fx[f.fx] = Date.now() + fxLeft(f.fx) + (f.ms || FX_MS); }
        busy = false; say(f.say || rnd(['Ням-ням!', 'Вкуснятина!', 'Спасибо!']), {voice: true}); render(); save();
      }, 1200);
    };
}

function wash() {
  if (S.sleeping) return say('Тсс... я сплю');
  if (busy) return; busy = true;
  const r = $('pet').getBoundingClientRect(), st = stageRect();
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('div');
    const s = 16 + Math.random() * 26;
    d.className = 'fx soap';
    d.style.width = d.style.height = s + 'px';
    d.style.left = (r.left - st.left + Math.random() * (r.width - s)) + 'px';
    d.style.top = (r.top - st.top + r.height * (.15 + Math.random() * .75)) + 'px';
    d.style.animationDelay = (Math.random() * .6) + 's';
    addFx(d, 2400);
  }
  say('Бульк-бульк!', {});
  setTimeout(() => { S.clean = cl(S.clean + 45); busy = false; say('Чистенький! Спасибо!', {voice: true}); render(); }, 1700);
}

function toggleSleep() {
  S.sleeping = !S.sleeping;
  if (S.sleeping) { closeSheet(); say('Спокойной ночи... Zzz', {}); }
  else say('Доброе утро!', {voice: true});
  updateZ(); render();
}

/* ---------- шторки ---------- */
function openSheet(title, html) { $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html; $('sheet').classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }
$('sheetX').onclick = closeSheet;

function openFood() {
  openSheet('Чем покормим? (у тебя 🪙 ' + S.coins + ')', '<div class="grid">' + FOODS.map((f, i) => `<button class="it ${S.coins < f.p ? 'lock' : ''}" data-food="${i}"><span>${f.img ? `<img class="fi" src="${f.img}" alt="">` : f.e}</span><small>${f.n}</small><small><b>🪙 ${f.p}</b></small>${f.tag ? `<small>${f.tag}</small>` : ''}</button>`).join('') + '</div>');
}
function openTalk() {
  const chips = ['Привет!', 'Как дела?', 'Ты классный!', 'Давай дружить', 'Я люблю математику'];
  openSheet('Скажи что-нибудь — Юнус повторит', '<div class="row"><input id="tin" maxlength="80" placeholder="Напиши фразу..." autocomplete="off"><button id="tgo">▶</button></div><div class="chips">' + chips.map(c => `<button data-chip="${c}">${c}</button>`).join('') + '</div>');
  $('tin').addEventListener('keydown', e => { if (e.key === 'Enter') sendTalk($('tin').value); });
  $('tgo').onclick = () => sendTalk($('tin').value);
}
function sendTalk(t) {
  t = (t || '').trim(); if (!t) return;
  closeSheet();
  if (S.sleeping) toggleSleep();
  S.fun = cl(S.fun + 4);
  setTimeout(() => say(t, {voice: true}), 250); render();
}
function openShop(keep) {
  const st = keep ? $('sheetBody').scrollTop : 0;
  const g = HATS.filter(x => !x.secret || S.owned[x.id]).map(x => {
    const owned = S.owned[x.id], on = S.hat === x.id || S.glasses === x.id;
    const lab = on ? 'Надето ✓' : owned ? 'Надеть' : '🪙 ' + x.p;
    return `<button class="it ${on ? 'on' : ''}" data-shop="${x.id}">${x.img ? `<span class="thumb ht"><img src="${x.img}" alt=""></span>` : `<span>${x.e}</span>`}<small>${x.n}</small><small><b>${lab}</b></small></button>`;
  }).join('');
  const gh = HAIRS.map(x => {
    const owned = S.ownedHair[x.id], on = S.hair === x.id;
    const lab = on ? 'Надето ✓' : owned ? 'Надеть' : '🪙 ' + x.p;
    return `<button class="it ${on ? 'on' : ''}" data-hair="${x.id}"><span class="thumb ht"><img src="hair-${x.id}.png" alt=""></span><small>${x.n}</small><small><b>${lab}</b></small></button>`;
  }).join('');
  const ge = EYES.filter(x => !x.secret || S.ownedEyes[x.id]).map(x => {
    const owned = S.ownedEyes[x.id], on = S.eyes === x.id;
    const lab = on ? 'Надето ✓' : owned ? 'Надеть' : '🪙 ' + x.p;
    return `<button class="it ${on ? 'on' : ''}" data-eyes="${x.id}"><span class="thumb et"><img src="${x.img}" alt=""></span><small>${x.n}</small><small><b>${lab}</b></small></button>`;
  }).join('');
  const ga = AURAS.filter(a => !a.secret || S.ownedAuras[a.id]).map(a => {
    const owned = S.ownedAuras[a.id], on = S.aura === a.id, ok = (S.clicks || 0) >= a.req;
    const lab = on ? 'Надето ✓' : owned ? 'Надеть' : ok ? 'Купить' : '🔒 ' + fmt(a.req) + ' 👆';
    return `<button class="it ${on ? 'on' : ''} ${(!owned && !ok) ? 'lock' : ''}" data-aura="${a.id}"><span class="thumb k-${a.id}"><img src="aura-${a.id}.png" alt=""></span><small>${a.n}</small><small><b>${lab}</b></small></button>`;
  }).join('');
  const gb = '<button class="it ' + (!S.bg ? 'on' : '') + '" data-bg=""><span class="thumb bt none"></span><small>Обычный</small><small><b>' + (!S.bg ? 'Выбран ✓' : 'Выбрать') + '</b></small></button>' + BGS.map(x => {
    const owned = S.ownedBg[x.id], on = S.bg === x.id;
    const lab = on ? 'Выбран ✓' : owned ? 'Выбрать' : '🪙 ' + x.p;
    return `<button class="it ${on ? 'on' : ''}" data-bg="${x.id}"><span class="thumb bt" style="background-image:url(bg-${x.id}.jpg)"></span><small>${x.n}</small><small><b>${lab}</b></small></button>`;
  }).join('');
  openSheet('Магазин', `<div class="sec">Одежда — за монеты (у тебя 🪙 ${S.coins})</div><div class="grid">${g}</div>
    <div class="sec">Причёски — за монеты</div><div class="grid">${gh}</div>
    ${ge ? `<div class="sec">Глаза</div><div class="grid">${ge}</div>` : ''}
    <div class="sec">Фоны — за монеты</div><div class="grid">${gb}</div>
    <div class="sec">Ауры — за клики (у тебя 👆 ${fmt(S.clicks || 0)}). Клики не тратятся!</div><div class="grid">${ga}</div>`);
  $('sheetBody').scrollTop = st;
}
function shop(id) {
  const x = HATS.find(y => y.id === id);
  if (!S.owned[id]) {
    if (S.coins < x.p) { say('Не хватает монет!', {}); return; }
    S.coins -= x.p; S.owned[id] = true;
  }
  S[x.slot] = (S[x.slot] === id) ? '' : id;
  if (S[x.slot] === id) say('Как я выгляжу?', {voice: true});
  render(); openShop(true); save();
}
function shopHair(id) {
  const x = HAIRS.find(y => y.id === id);
  if (!S.ownedHair[id]) {
    if (S.coins < x.p) { say('Не хватает монет!', {}); return; }
    S.coins -= x.p; S.ownedHair[id] = true;
  }
  S.hair = (S.hair === id) ? '' : id;
  if (S.hair === id) say('Новая причёска! Как тебе?', {voice: true});
  render(); openShop(true); save();
}
function shopEyes(id) {
  const x = EYES.find(y => y.id === id); if (!x) return;
  if (!S.ownedEyes[id]) {
    if (x.secret) return;
    if (S.coins < x.p) { say('Не хватает монет!', {}); return; }
    S.coins -= x.p; S.ownedEyes[id] = true;
  }
  S.eyes = (S.eyes === id) ? '' : id;
  if (S.eyes === id) say(id === 'gold' ? 'Золотые глаза!' : 'Шаринган!', {voice: true});
  render(); openShop(true); save();
}
function shopAura(id) {
  const a = AURAS.find(y => y.id === id);
  if (!S.ownedAuras[id]) {
    if ((S.clicks || 0) < a.req) { say('Нужно ещё ' + fmt(a.req - S.clicks) + ' кликов!', {}); return; }
    S.ownedAuras[id] = true;
  }
  S.aura = (S.aura === id) ? '' : id;
  if (S.aura === id) say('Вот это сила!', {voice: true});
  render(); openShop(true); save();
}

$('sheetBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.food !== undefined) feed(+t.dataset.food);
  else if (t.dataset.chip) sendTalk(t.dataset.chip);
  else if (t.dataset.shop) shop(t.dataset.shop);
  else if (t.dataset.aura) shopAura(t.dataset.aura);
  else if (t.dataset.hair) shopHair(t.dataset.hair);
  else if (t.dataset.eyes) shopEyes(t.dataset.eyes);
  else if (t.dataset.bg !== undefined) shopBg(t.dataset.bg);
});
document.querySelector('.actions').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'sleep') return toggleSleep();
  if (S.sleeping && a !== 'talk') { closeSheet(); return say('Тсс... он спит. Разбуди его кнопкой ☀️'); }
  if (a === 'food') openFood();
  else if (a === 'wash') { closeSheet(); wash(); }
  else if (a === 'play') startGame();
  else if (a === 'talk') openTalk();
  else if (a === 'shop') openShop();
});

/* ---------- мини-игра «Лови еду» ---------- */
let game = null;
function startGame() {
  if (game || busy) return;
  if (S.energy < 10) return say('Я устал... Дай поспать', {voice: true});
  closeSheet();
  $('app').classList.add('gaming');
  const layer = $('game'), hud = $('hud'); hud.hidden = false;
  game = {score: 0, time: 20, items: [], spawn: 0, last: performance.now()};
  say('Лови еду! Острого не трогай 🌶️', {voice: true});
  function spawn() {
    const bad = Math.random() < .2;
    const el = document.createElement('div');
    el.className = 'item'; el.textContent = bad ? '🌶️' : rnd(['🍎', '🍕', '🍩', '🍔', '⭐', '🍪']);
    const W = layer.clientWidth, x = Math.random() * (W - 56);
    const it = {el, x, y: -60, v: 130 + Math.random() * 110 + (20 - game.time) * 7, bad, dead: false};
    el.style.transform = `translate(${x}px,${it.y}px)`;
    el.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      if (it.dead) return; it.dead = true; el.remove();
      if (bad) { game.score = Math.max(0, game.score - 2); say('Остро! Фу!', {}); }
      else { game.score++; $('mouth').className = 'mouth wow'; setTimeout(() => { if (!S.sleeping) $('mouth').className = 'mouth'; }, 250); }
    });
    layer.appendChild(el); game.items.push(it);
  }
  function loop(now) {
    if (!game) return;
    const dt = Math.min(.05, (now - game.last) / 1000); game.last = now;
    game.time -= dt; game.spawn -= dt;
    if (game.spawn <= 0) { spawn(); game.spawn = Math.max(.28, .6 - (20 - game.time) * .015); }
    const H = layer.clientHeight;
    for (const it of game.items) {
      if (it.dead) continue;
      it.y += it.v * dt; it.el.style.transform = `translate(${it.x}px,${it.y}px)`;
      if (it.y > H) { it.dead = true; it.el.remove(); }
    }
    game.items = game.items.filter(i => !i.dead);
    hud.textContent = `⭐ ${game.score}   ⏱ ${Math.ceil(game.time)}`;
    if (game.time <= 0) return endGame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
function endGame() {
  const sc = game.score; game = null;
  $('game').innerHTML = ''; $('hud').hidden = true; $('app').classList.remove('gaming');
  S.coins += sc; S.fun = cl(S.fun + Math.min(45, sc * 2.5)); S.hunger = cl(S.hunger - 5); S.energy = cl(S.energy - 8);
  const rec = sc > (S.best || 0); if (rec) S.best = sc;
  say(rec && sc > 0 ? `Новый рекорд: ${sc}! +${sc} 🪙` : `Ура! Поймали ${sc}. +${sc} 🪙`, {voice: true});
  render(); save();
}

/* ---------- жизнь ---------- */
let ticks = 0;
function tick(dt) {
  if (S.sleeping) {
    S.energy = cl(S.energy + dt * 1.5); S.hunger = cl(S.hunger - dt * .04);
    S.fun = cl(S.fun - dt * .03); S.clean = cl(S.clean - dt * .03);
    if (S.energy >= 100) toggleSleep();
  } else {
    S.hunger = cl(S.hunger - dt * .13); S.fun = cl(S.fun - dt * .11);
    S.clean = cl(S.clean - dt * .07); S.energy = cl(S.energy - dt * .07);
  }
}
setInterval(() => { tick(1); render(); if (++ticks % 5 === 0) save(); }, 1000);

setInterval(() => {
  if (S.sleeping || busy || game || $('start').style.display === 'none' === false) return;
  const needs = [[S.hunger, 'Я голодный!'], [S.fun, 'Мне скучно...'], [S.clean, 'Хочу помыться!'], [S.energy, 'Хочу спать...']].sort((a, b) => a[0] - b[0])[0];
  if (needs[0] < 35) say(needs[1], {});
  else if (Math.random() < .5) say(rnd(['Как дела?', 'Поиграем?', 'Я ' + S.name + '!', 'Здорово тут!', 'Потыкай меня!']), {});
}, 9000);

function toggleFS() {
  try {
    const d = document, e = d.documentElement;
    const on = d.fullscreenElement || d.webkitFullscreenElement;
    const p = on ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (e.requestFullscreen || e.webkitRequestFullscreen).call(e);
    if (p && p.catch) p.catch(() => {});
  } catch (err) {}
}
(function () {
  const e = document.documentElement;
  const can = e.requestFullscreen || e.webkitRequestFullscreen;
  const installed = window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone);
  if (!can || installed) $('fsBtn').style.display = 'none';
  $('fsBtn').addEventListener('click', toggleFS);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (err) {} });
  }
})();

$('startBtn').onclick = () => {
  try { if (!document.fullscreenElement && !navigator.standalone) toggleFS(); } catch (err) {}
  $('start').style.display = 'none';
  render(); updateZ();
  say('Привет! Я ' + S.name + '!', {voice: true});
  if (S.seenVer !== VERSION) { S.seenVer = VERSION; save(); setTimeout(openChangelog, 1400); }
};
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
render();
</script>
</body>
</html>
